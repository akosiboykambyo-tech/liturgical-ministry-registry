name: RC1 Windows startup and Chromium smoke
on:
  push:
    branches:
      - qa/windows-rc1-runner-smoke-20261123
  workflow_dispatch:
  pull_request:
    branches:
      - integration/rc1-security-consolidation-20261123

permissions:
  contents: read

jobs:
  windows-startup:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout QA harness only
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse exact user-facing QA script under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $script=[IO.Path]::Combine($env:GITHUB_WORKSPACE,'scripts','qa','COWL-DOK-RC1-Real-Auth-Browser-QA-v3.ps1')
          $tokens=$null
          $errors=$null
          $ast=[System.Management.Automation.Language.Parser]::ParseFile($script,[ref]$tokens,[ref]$errors)
          if($errors.Count -ne 0){foreach($e in $errors){Write-Host $e.Message};throw 'PowerShell 5.1 syntax check failed'}
          Write-Host 'PASS: Full QA launcher parses in Windows PowerShell 5.1.'
      - name: Run exact user-facing QA launcher in credential-free Windows smoke mode
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $script=[IO.Path]::Combine($env:GITHUB_WORKSPACE,'scripts','qa','COWL-DOK-RC1-Real-Auth-Browser-QA-v3.ps1')
          & $script -RepoPath $env:GITHUB_WORKSPACE -SmokeOnly
