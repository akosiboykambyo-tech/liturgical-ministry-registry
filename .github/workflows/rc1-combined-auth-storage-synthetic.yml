name: RC1 combined Auth v2.198 and Storage v1.98 offline SQL rehearsal
on:
  push:
    branches: [qa/recovery-cli-windows-preflight-20261124]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  combined-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Boot network-disabled PG17 with no host ports
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name cowl_combo_db --network none \
            --tmpfs /var/lib/postgresql/data:rw,size=2g --tmpfs /restore-input:rw,size=128m \
            -e POSTGRES_PASSWORD=postgres supabase/postgres:17.6.1.136
          for i in $(seq 1 90); do
            if docker exec cowl_combo_db pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then break; fi
            sleep 2
          done
          test "$(docker inspect --format '{{.HostConfig.NetworkMode}}' cowl_combo_db)" = none
          test "$(docker inspect --format '{{json .HostConfig.PortBindings}}' cowl_combo_db)" = '{}'
      - name: Apply official Auth v2.198.0 schema migrations
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network container:cowl_combo_db \
            -e GOTRUE_DB_DRIVER=postgres \
            -e GOTRUE_DB_DATABASE_URL='postgres://supabase_auth_admin:postgres@127.0.0.1:5432/postgres?sslmode=disable' \
            -e GOTRUE_JWT_SECRET='synthetic-only-jwt-secret-not-for-real-use-123456' \
            -e GOTRUE_SITE_URL='http://localhost:9999' -e API_EXTERNAL_URL='http://localhost:9999' \
            -e GOTRUE_API_HOST='127.0.0.1' supabase/gotrue:v2.198.0 gotrue migrate >/dev/null 2>&1
      - name: Initialize new Storage API v1.98.5 managed schema in same disconnected namespace
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name cowl_combo_storage --network container:cowl_combo_db \
            --tmpfs /var/lib/storage:rw,size=128m \
            -e ANON_KEY='synthetic-anon' -e SERVICE_KEY='synthetic-service' \
            -e AUTH_JWT_SECRET='synthetic-only-secret-1234567890' \
            -e DATABASE_URL='postgres://supabase_storage_admin:postgres@127.0.0.1:5432/postgres?sslmode=disable' \
            -e POSTGREST_URL='http://127.0.0.1:3000' \
            -e STORAGE_PUBLIC_URL='http://127.0.0.1:5000' \
            -e FILE_SIZE_LIMIT=52428800 -e STORAGE_BACKEND=file \
            -e FILE_STORAGE_BACKEND_PATH=/var/lib/storage \
            -e GLOBAL_S3_BUCKET=synthetic-only \
            -e TENANT_ID=synthetic-only -e REGION=local -e ENABLE_IMAGE_TRANSFORMATION=false \
            ghcr.io/supabase/storage-api:v1.98.5 >/dev/null
          found=0
          for i in $(seq 1 50); do
            found=$(docker exec cowl_combo_db psql -X -A -t -U postgres -d postgres -c \
              "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='storage' AND c.relname IN ('bucket_lifecycle_states','buckets','buckets_analytics','lifecycle_abandoned_artifacts','objects','s3_multipart_uploads','s3_multipart_uploads_parts') AND c.relkind IN ('r','p');")
            if test "$found" = 7; then break; fi
            sleep 2
          done
          test "$found" = 7
          docker rm -f cowl_combo_storage >/dev/null
          echo 'PASS: all seven Storage managed tables initialized alongside Auth schema'
      - name: Replay synthetic registry/Auth/Storage SQL through file-based psql
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/cowl-combo-synthetic.sql" <<'SQL'
          BEGIN;
          SET session_replication_role = replica;
          CREATE TABLE public.cowl_qa_restore (id integer primary key, label text);
          ALTER TABLE public.cowl_qa_restore ENABLE ROW LEVEL SECURITY;
          CREATE POLICY synthetic_read ON public.cowl_qa_restore FOR SELECT TO authenticated USING (true);
          COPY public.cowl_qa_restore (id,label) FROM stdin;
          1	synthetic-only
          \.
          COPY auth.one_time_tokens (link_token_hash) FROM stdin;
          \.
          INSERT INTO auth.users (instance_id,id,aud,role,email,encrypted_password,email_confirmed_at,created_at,updated_at,raw_app_meta_data,raw_user_meta_data)
          VALUES ('00000000-0000-0000-0000-000000000000','11111111-1111-4111-8111-111111111111','authenticated','authenticated','synthetic-only@example.invalid','!',now(),now(),now(),'{}'::jsonb,'{}'::jsonb);
          INSERT INTO auth.identities (id,user_id,provider_id,identity_data,provider,created_at,updated_at)
          VALUES ('22222222-2222-4222-8222-222222222222','11111111-1111-4111-8111-111111111111','synthetic-only@example.invalid','{"sub":"11111111-1111-4111-8111-111111111111","email":"synthetic-only@example.invalid"}'::jsonb,'email',now(),now());
          COPY storage.buckets (id,name,public) FROM stdin;
          member-documents	member-documents	f
          \.
          COPY storage.objects (id,bucket_id,name,version,is_versioned) FROM stdin;
          33333333-3333-4333-8333-333333333333	member-documents	synthetic-only.txt	\N	f
          \.
          SET session_replication_role = origin;
          COMMIT;
          SQL
          docker exec -i cowl_combo_db sh -c 'umask 077; cat > /restore-input/synthetic.sql' < "$RUNNER_TEMP/cowl-combo-synthetic.sql"
          digest1=$(sha256sum "$RUNNER_TEMP/cowl-combo-synthetic.sql" | cut -d' ' -f1)
          digest2=$(docker exec cowl_combo_db sha256sum /restore-input/synthetic.sql | cut -d' ' -f1)
          test "$digest1" = "$digest2"
          docker exec cowl_combo_db psql -X -q --single-transaction -v ON_ERROR_STOP=1 -v VERBOSITY=sqlstate \
            -U supabase_admin -d postgres -f /restore-input/synthetic.sql
          q=$(docker exec cowl_combo_db psql -X -A -t -U postgres -d postgres -c \
            "SELECT (SELECT count(*) FROM public.cowl_qa_restore), (SELECT count(*) FROM auth.users WHERE id='11111111-1111-4111-8111-111111111111'), (SELECT count(*) FROM auth.identities WHERE user_id='11111111-1111-4111-8111-111111111111'), (SELECT count(*) FROM storage.buckets WHERE id='member-documents' AND public=false), (SELECT count(*) FROM storage.objects WHERE bucket_id='member-documents' AND is_versioned=false);")
          test "$q" = '1|1|1|1|1'
          echo 'PASS: combined Auth+Storage+public SQL restored into disconnected PostgreSQL with SHA256 staging'
      - name: Cleanup
        if: always()
        run: |
          docker rm -f cowl_combo_storage >/dev/null 2>&1 || true
          docker rm -f cowl_combo_db >/dev/null 2>&1 || true
