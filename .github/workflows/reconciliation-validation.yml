name: Reconciliation validation (no deployment)

on:
  push:
    branches:
      - audit/pr30-pr53-failclosed-reconciliation-20261118
      - feature/atomic-intake-adapter-review-20261119
      - feature/registration-intake-v2-sql-review-20261119
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Regression, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: PR30 and PR53 isolated unit regression tests
        run: node --test tests/pr30-fail-closed-regression.test.cjs tests/pr53-registry-write-contract.test.cjs
      - name: Atomic registration contract tests (mock only)
        run: node --test tests/registration-atomic-intake.test.cjs
      - name: V2 SQL static contracts and CSV source identity (no DB)
        run: node --test tests/registration-intake-v2-sql-contract.test.cjs
      - name: Existing PR79 no-bypass regression tests
        run: node --test tests/pr79-registry-no-bypass.test.cjs
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Next.js production build (no deployment)
        # Build-time placeholders only: Supabase client construction requires both
        # NEXT_PUBLIC values during Next.js prerendering. These are NOT credentials,
        # cannot access any real Supabase project, and are not used for DB tests.
        # Actual deployment must use its own reviewed environment configuration.
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://ci-build-placeholder.invalid"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-build-placeholder-not-a-real-anon-key"
        run: npm run build
