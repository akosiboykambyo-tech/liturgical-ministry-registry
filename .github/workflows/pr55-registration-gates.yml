name: PR55 registration release gates (offline)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/pr55-*.cjs'
      - 'scripts/pr55-*.ps1'
      - 'tests/production-registration-*.test.cjs'
      - 'tests/registration-matching.test.cjs'
      - 'docs/sql/registration-*.sql'
      - 'docs/sql/pr55-*.sql'
      - 'lib/registration-matching.ts'
      - 'lib/production-registration-preflight.ts'
      - 'lib/registry-admin-writes.ts'
      - 'lib/duplicate-check.ts'
      - 'lib/verify-actions.ts'
      - 'app/admin/members/**'
      - 'app/admin/import/page.tsx'
      - 'app/admin/verify/page.tsx'
      - 'components/member-detail-drawer.tsx'
      - '.github/workflows/pr55-registration-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr55-registration-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout inspected source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run registration tests
        run: npm run test:registration
      - name: Run PR55 offline safety and compatibility tests
        run: npm run test:production-registration
      - name: Check staging HTTP test syntax without credentials or network
        run: node --check scripts/pr55-staging-nonadmin-readonly-http.cjs
      - name: Check types
        run: npm run typecheck

# No staging credentials, Vercel secrets, database migrations, API calls,
# session tests or production deployments are executed from this workflow.

  powershell-parse:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout source only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Parse offline protection script; do not execute or access private backups
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $paths = @('scripts/pr55-protect-current-recovery-set.ps1', 'scripts/pr55-verify-encrypted-recovery-copy.ps1', 'scripts/pr55-run-staging-nonadmin-readonly.ps1')
          foreach ($relative in $paths) {
            $errors = $null
            $path = Join-Path $PWD $relative
            [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw 'PowerShell syntax errors'
            }
          }
          Write-Output 'PASS: PowerShell backup-protection script parses; no data or credentials accessed'
