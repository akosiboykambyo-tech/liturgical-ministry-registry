name: PR55 registration release gates (offline)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/pr55-*.cjs'
      - 'tests/production-registration-*.test.cjs'
      - 'tests/registration-matching.test.cjs'
      - 'docs/sql/registration-*.sql'
      - 'docs/sql/pr55-*.sql'
      - 'lib/registration-matching.ts'
      - 'lib/production-registration-preflight.ts'
      - '.github/workflows/pr55-registration-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr55-registration-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout inspected source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run registration tests
        run: npm run test:registration
      - name: Run PR55 offline safety and compatibility tests
        run: npm run test:production-registration
      - name: Check types
        run: npm run typecheck

# No staging credentials, Vercel secrets, database migrations, API calls,
# session tests or production deployments are executed from this workflow.
