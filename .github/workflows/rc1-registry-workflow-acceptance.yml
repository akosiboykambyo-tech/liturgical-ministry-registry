name: RC1 Registry workflow acceptance (synthetic data, no secrets)
on:
  push:
    branches:
      - qa/windows-rc1-runner-smoke-20261123
  pull_request:
    branches:
      - integration/rc1-security-consolidation-20261123
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies, no remote credentials
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute actual TypeScript Registry workflows with synthetic backend
        run: node --test tests/rc1-registry-workflow-integration.test.cjs
      - name: Preserve strict evidence scope
        run: |
          echo "PASS: actual Add Member and CSV staging/chunking functions under synthetic PostgREST responses."
          echo "No remote TEST or Production access; no real member changes."
          echo "This does not assert full UI automation or Production database invariants."
