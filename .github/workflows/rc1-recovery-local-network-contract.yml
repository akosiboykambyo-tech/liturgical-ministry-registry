name: RC1 recovery isolated Docker startup preflight — synthetic only
on:
  push:
    branches:
      - qa/recovery-cli-windows-preflight-20261124
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-local-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3
        with:
          version: 2.84.2
      - name: Initialize disposable stack and internal loopback network (no Production data)
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/cowl_recovery_ci"
          mkdir -p "$WORK"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          cd "$WORK"
          supabase init
          docker network create --driver bridge --internal -o com.docker.network.bridge.host_binding_ipv4=127.0.0.1 cwldok_recovery_ci
      - name: Start local Supabase with explicit network isolation
        run: |
          set -euo pipefail
          cd "$WORK"
          supabase start --network-id cwldok_recovery_ci -x studio,postgres-meta,imgproxy,logflare,vector,edge-runtime,realtime,supavisor > "$RUNNER_TEMP/local-stack-start.log" 2>&1 || {
            echo "FAIL: local CLI start with isolated network"
            python3 -c "import re,os; p=os.environ['RUNNER_TEMP']+'/local-stack-start.log'; ls=open(p,errors='replace').read().splitlines(); matched=[x for x in ls if re.search('error|failed|denied|network|timeout|connection|unable',x,re.I)]; safe=[re.sub(r'(eyJ|sb_secret_)[A-Za-z0-9_.-]+','[REDACTED]',x) for x in matched[-12:]]; print('DIAGNOSTIC:', '\\n'.join(x[:240] for x in safe))"
            exit 1
          }
          echo 'PASS: local Supabase started on the internal bridge'
      - name: Verify loopback-only ports and execute synthetic SQL
        run: |
          set -euo pipefail
          cd "$WORK"
          DB=$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -1)
          test -n "$DB"
          docker ps --format '{{.Names}}' | grep '^supabase_kong_' >/dev/null
          for name in $(docker ps --format '{{.Names}}' | grep '^supabase_'); do
            docker inspect --format '{{json .NetworkSettings.Ports}}' "$name" | python3 -c 'import json,sys;p=json.load(sys.stdin);assert all(b.get("HostIp") in ("127.0.0.1","::1") for ls in p.values() if ls for b in ls)'
          done
          docker exec -e PGPASSWORD=postgres "$DB" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE TABLE public.qa_disposable_restore_only (id integer primary key); INSERT INTO public.qa_disposable_restore_only VALUES (93);"
          ACTUAL=$(docker exec -e PGPASSWORD=postgres "$DB" psql -X -U postgres -d postgres -At -c "SELECT count(*) FROM public.qa_disposable_restore_only WHERE id=93")
          test "$ACTUAL" = 1
          echo 'PASS: localhost-only bindings and synthetic SQL restore contract'
      - name: Destroy only this disposable stack and network
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/cowl_recovery_ci" ]; then
            (cd "$RUNNER_TEMP/cowl_recovery_ci" && supabase stop --no-backup) || true
          fi
          docker network rm cwldok_recovery_ci || true
